name: Decode Real Food Gallery
on:
  push:
    paths:
      - .github/workflows/decode-real-food-gallery.yml
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode gallery image
        run: |
          test -f assets/celebration-table.webp.b64
          base64 --decode assets/celebration-table.webp.b64 > assets/celebration-table.webp
      - name: Commit browser-ready image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/celebration-table.webp
          git commit -m "Publish real food gallery image" || exit 0
          git push
