name: Delicias Site Integrity

on:
  push:
    paths:
      - "index.html"
      - "assets/**"
      - "media/**"
      - ".github/workflows/fix-kitchen-gallery-and-partner-button.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify kitchen media and ABARCALYST presentation
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'id="real-food-gallery"' index.html
          grep -q 'class="abarcalyst-ad"' index.html
          grep -q 'class="btn ab-cta"' index.html

          if grep -Eq '<[^>]+class="[^"]*abarcalyst-banner' index.html; then
            echo "Duplicate ABARCALYST footer banner found."
            exit 1
          fi

          mapfile -t kitchen_assets < <(grep -oE 'assets/kitchen-[^"]+\.b64' index.html | sort -u)
          if (( ${#kitchen_assets[@]} < 15 )); then
            echo "Expected at least 15 real kitchen assets; found ${#kitchen_assets[@]}."
            exit 1
          fi

          for asset in "${kitchen_assets[@]}"; do
            test -s "$asset" || {
              echo "Missing or empty kitchen asset: $asset"
              exit 1
            }
          done

          grep -q 'media/delicias-ceviche-still.webp' index.html
          grep -q 'media/delicias-ceviche-preparation.mp4' index.html
          test -s media/delicias-ceviche-still.webp
          test -s media/delicias-ceviche-preparation.mp4

          echo "Delicias Daniel site integrity checks passed."
